<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurel Studio</title>
    <style>
      :root {
        --bg: #12141c;
        --card: #1b1e2a;
        --text: #f2f3f7;
        --muted: #9aa0b4;
        --accent: #ff8f3f;
        --line: #2a2e3d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
          "Apple SD Gothic Neo", sans-serif;
        line-height: 1.7;
      }
      .wrap { max-width: 780px; margin: 0 auto; padding: 80px 24px 60px; }
      .brand {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin: 0 0 12px;
        background: linear-gradient(90deg, #ffd08a, var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .tag { color: var(--muted); font-size: 17px; margin: 0 0 48px; }
      h2 { font-size: 20px; margin: 0 0 18px; }
      .apps { display: grid; gap: 14px; margin-bottom: 48px; }
      .app {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px 22px;
      }
      .app h3 { margin: 0 0 6px; font-size: 17px; }
      .app p { margin: 0; color: var(--muted); font-size: 15px; }
      .contact {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 24px;
      }
      .contact p { margin: 0 0 8px; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      footer {
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 class="brand">Aurel Studio</h1>
      <p class="tag">아이와 일상을 위한 앱을 만듭니다.</p>

      <h2>앱</h2>
      <div class="apps">
        <div class="app">
          <h3>히어로 아카데미</h3>
          <p>문제를 풀며 강해지는 4~10세 학습 RPG. 영어·수학을 게임처럼 익힙니다.</p>
        </div>
      </div>

      <h2>문의</h2>
      <div class="contact">
        <p>제품 문의 및 지원</p>
        <p><a href="mailto:thirtyshots2689@outlook.com">thirtyshots2689@outlook.com</a></p>
      </div>

      <footer>
        <span>© 2026 Aurel Studio</span>
        <a href="./privacy/">개인정보처리방침</a>
      </footer>
    </div>
  </body>
</html>
